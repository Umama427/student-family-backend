name: student_family_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # API Calls
  http: ^1.6.0

  # Charts (Pie Chart, Line Graph)
  fl_chart: ^0.68.0

  # WhatsApp Link Launcher
  url_launcher: ^6.3.0

  # PDF View
  printing: ^5.13.1
  pdf: ^3.11.0

  # Date Formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.6

  # Loading Effects
  shimmer: ^3.0.0

  # Modern Fonts
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true